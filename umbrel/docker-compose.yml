version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: deepsea-dashboard_deepsea_1
      APP_PORT: 8000

  init:
    image: ghcr.io/djobleezy/deepsea-dashboard:2.2.0
    user: "0:0"
    restart: "no"
    # Docker creates missing bind directories as root. Prepare only this
    # app's storage before the non-root service starts, including upgrades.
    entrypoint: ["sh", "-c", "mkdir -p /data /config && chown -R 1000:1000 /data /config"]
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/config:/config
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: on-failure
    # Let the official entrypoint initialize bind-mount ownership, then drop
    # privileges to the image's redis user before starting the server.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ${APP_DATA_DIR}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  deepsea:
    image: ghcr.io/djobleezy/deepsea-dashboard:2.2.0
    user: "1000:1000"
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/config:/config
    environment:
      - DB_PATH=/data/deepsea.db
      - CONFIG_PATH=/config/config.json
      - REDIS_URL=redis://deepsea-dashboard_redis_1:6379/0
      # Live DATUM Gateway probe — point at the Umbrel DATUM app's API
      # listener so the dashboard can render a real-time DATUM badge
      # instead of relying on the lagging pool_fees_percentage signal.
      # Only truly unset uses the default; pass DATUM_GATEWAY_URL=""
      # (explicit empty) to disable the probe and fall back to fee-only.
      - DATUM_GATEWAY_URL=${DATUM_GATEWAY_URL-http://datum_datum_1:21000}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "/app/backend/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
