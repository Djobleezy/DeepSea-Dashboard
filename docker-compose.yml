x-app-image: &app-image
  image: deepsea-dashboard:local
  build:
    context: .
    dockerfile: Dockerfile

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c 'redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
      --requirepass "${REDIS_PASSWORD:-change-me-in-production}"'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-change-me-in-production}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 3

  config-init:
    <<: *app-image
    user: "0:0"
    restart: "no"
    entrypoint: ["/usr/local/bin/config_init.sh"]
    environment:
      - CONFIG_PATH=/config/config.json
      - CONFIG_SEED_PATH=/config/seed.json
    volumes:
      - deepsea-config:/config
      - ./config.json:/config/seed.json:ro
    security_opt:
      - no-new-privileges:true

  app:
    <<: *app-image
    restart: unless-stopped
    ports:
      - "5050:8000"
    environment:
      - CONFIG_PATH=/config/config.json
      - REDIS_PASSWORD=${REDIS_PASSWORD:-change-me-in-production}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change-me-in-production}@redis:6379/0
      - DB_PATH=/data/deepsea.db
    volumes:
      - deepsea-config:/config
      - deepsea-data:/data
    depends_on:
      config-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "/app/backend/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  deepsea-config:
    driver: local
  deepsea-data:
    driver: local
