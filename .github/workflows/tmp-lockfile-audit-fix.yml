> **Temporary workflow** — regenerates frontend/package-lock.json via `npm audit fix`
> on the runner (the remote session cannot push large files directly). Deleted from
> the branch immediately after it runs.

name: tmp-lockfile-audit-fix
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/github-issues-review-wi5c86
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit fix
        working-directory: frontend
        run: |
          npm audit fix
          npm audit --audit-level=high
      - name: Verify frontend still builds and tests pass
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
      - name: Commit and push lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --quiet || git commit -m "fix(ci): npm audit fix — clear high npm advisories (undici, vite)"
          git push origin HEAD:claude/github-issues-review-wi5c86
